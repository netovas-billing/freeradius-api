  models.Radippool:
    properties:
      calledstationid:
        type: string
      callingstationid:
        type: string
      expiry_time:
        type: string
      framedipaddress:
        type: string
      id:
        type: integer
      nasipaddress:
        type: string
      pool_key:
        type: string
      pool_name:
        type: string
      username:
        type: string
