  models.Webhook:
    properties:
      created_at:
        type: string
      cursor:
        type: integer
      enabled:
        type: boolean
      event:
        description: session_stop|session_start|auth_accept|auth_reject
        type: string
      failure_count:
        type: integer
      id:
        type: integer
      last_fired_at:
        type: string
      name:
        type: string
      url:
        type: string
