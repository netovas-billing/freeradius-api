securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-API-Key
    type: apiKey
  BasicAuth:
    type: basic
swagger: "2.0"
tags:
- description: User & password & per-user attribute CRUD
  name: users
- description: Group attributes & membership
  name: groups
- description: NAS clients (DB-backed alternative to clients.conf)
  name: nas
- description: Session history & traffic aggregation
  name: accounting
- description: Live session control (Disconnect / CoA)
  name: sessions
- description: Post-authentication audit log
  name: postauth
- description: Dashboard counters & top-N
  name: stats
- description: radippool / sqlippool inspection
  name: ippool
- description: Event subscriptions (admin only)
  name: webhooks
- description: API key management (admin only)
  name: keys
- description: API access audit log (admin only)
  name: audit
- description: Healthcheck & root
  name: meta
- description: Legacy /api/v1/users — radcheck row-level CRUD (nasvpntest-api compat)
  name: v1-users
- description: Legacy /api/v1/user-group/ — radusergroup row CRUD
  name: v1-radusergroup
- description: Legacy /api/v1/group/ — radgroupreply row CRUD
  name: v1-radgroupreply
- description: Legacy /api/v1/group-check/ — radgroupcheck row CRUD
  name: v1-radgroupcheck
- description: Legacy /api/v1/reply/ — radreply row CRUD
  name: v1-radreply
- description: Legacy /api/v1/nas/ — NAS row CRUD (secret exposed)
  name: v1-nas
- description: Legacy /api/v1/radacct/ — accounting read + user status
  name: v1-radacct
- description: Legacy /api/v1/disconnect — kick user by username
  name: v1-disconnect
