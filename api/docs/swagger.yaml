  models.WebhookDelivery:
    properties:
      duration_ms:
        type: integer
      error:
        type: string
      event:
        type: string
      id:
        type: integer
      status_code:
        type: integer
      timestamp:
        type: string
      url:
        type: string
      webhook_id:
        type: integer
    type: object
  schemas.ApiKeyCreate:
    properties:
      name:
        example: web-portal
        type: string
      notes:
        type: string
      scope:
        example: write
        type: string
    type: object
  schemas.ApiKeyCreatedResponse:
    properties:
      id:
        type: integer
      key:
        example: shown ONLY once — store it securely
        type: string
      name:
        type: string
      scope:
        type: string
    type: object
  schemas.ApiKeyUpdate:
    properties:
      enabled:
        type: boolean
      notes:
        type: string
      scope:
        type: string
    type: object
  schemas.AttributeIn:
    properties:
      attribute:
        example: Session-Timeout
        type: string
      op:
        example: :=
        type: string
      value:
        example: "3600"
        type: string
    type: object
  schemas.AttributeOut:
    properties:
      attribute:
        type: string
      id:
        type: integer
      op:
        type: string
      value:
        type: string
    type: object
  schemas.AttributeUpdate:
    properties:
      attribute:
        type: string
      op:
        type: string
      value:
        type: string
    type: object
  schemas.AuthSummary:
    properties:
      accept:
        type: integer
      reject:
        type: integer
      since_hours:
        type: integer
    type: object
  schemas.BulkUserResponse:
    properties:
      created:
        type: integer
      failed:
        type: integer
      results:
        items:
          $ref: '#/definitions/schemas.BulkUserResult'
        type: array
      total:
        type: integer
    type: object
  schemas.BulkUserResult:
    properties:
      error:
        type: string
      index:
        type: integer
      status:
        description: created | error
        type: string
      username:
        type: string
    type: object
  schemas.DisconnectRequest:
    properties:
      port:
        example: 3799
        type: integer
      timeout_ms:
        example: 3000
        type: integer
    type: object
  schemas.DisconnectResponse:
    properties:
      acctsessionid:
        type: string
      code:
        type: string
      nasipaddress:
        type: string
      port:
        type: integer
      status:
        type: string
      username:
        type: string
    type: object
  schemas.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  schemas.GroupCreate:
    properties:
      check_attributes:
        items:
          $ref: '#/definitions/schemas.AttributeIn'
        type: array
      groupname:
        example: wifi
        type: string
      reply_attributes:
        items:
          $ref: '#/definitions/schemas.AttributeIn'
        type: array
    type: object
  schemas.GroupOut:
    properties:
      check_attributes:
        items:
          $ref: '#/definitions/schemas.AttributeOut'
        type: array
      groupname:
        type: string
      reply_attributes:
        items:
          $ref: '#/definitions/schemas.AttributeOut'
        type: array
    type: object
  schemas.NASCreate:
    properties:
      community:
        type: string
      description:
        type: string
      nasname:
        example: 192.168.1.1
        type: string
      ports:
        type: integer
      secret:
        example: testing123
        type: string
      server:
        type: string
      shortname:
        example: mainrouter
        type: string
      type:
        example: other
        type: string
    type: object
  schemas.NASUpdate:
    properties:
      community:
        type: string
      description:
        type: string
      nasname:
        type: string
      ports:
        type: integer
      secret:
        type: string
      server:
        type: string
      shortname:
        type: string
      type:
        type: string
    type: object
  schemas.PoolSummary:
    properties:
      allocated:
        type: integer
      available:
        type: integer
      pool_name:
        type: string
      total:
        type: integer
    type: object
  schemas.StatsOverview:
    properties:
      active_sessions:
        type: integer
      auth_accept_24h:
        type: integer
      auth_reject_24h:
        type: integer
      groups:
        type: integer
      input_bytes_24h:
        type: integer
      nas:
        type: integer
      output_bytes_24h:
        type: integer
      sessions_today:
        type: integer
      users:
        type: integer
    type: object
  schemas.TopUser:
    properties:
      input_bytes:
        type: integer
      output_bytes:
        type: integer
      total_bytes:
        type: integer
      username:
        type: string
    type: object
  schemas.UserCreate:
    properties:
      check_attributes:
        items:
          $ref: '#/definitions/schemas.AttributeIn'
        type: array
      groups:
        items:
          type: string
        type: array
      password:
        example: s3cret
        type: string
      password_attr:
        example: Cleartext-Password
        type: string
      reply_attributes:
        items:
          $ref: '#/definitions/schemas.AttributeIn'
        type: array
      username:
        example: alice
        type: string
    type: object
  schemas.UserOut:
    properties:
      check_attributes:
        items:
          $ref: '#/definitions/schemas.AttributeOut'
        type: array
      groups:
        items:
          type: string
        type: array
      reply_attributes:
        items:
          $ref: '#/definitions/schemas.AttributeOut'
        type: array
      username:
        type: string
    type: object
  schemas.UserPasswordUpdate:
    properties:
      password:
        example: newpass
        type: string
      password_attr:
        example: Cleartext-Password
        type: string
    type: object
  schemas.UserUsage:
    properties:
      input_bytes:
        type: integer
      output_bytes:
        type: integer
      session_count:
        type: integer
      total_session_seconds:
        type: integer
      username:
        type: string
    type: object
  schemas.V1DisconnectRequest:
    properties:
      nas_ip:
        type: string
      nas_ip_address:
        description: |-
          NASIPAddress dan NasIP adalah nama yang SAMA artinya.

          `nas_ip` adalah nama yang didokumentasikan aplikasi Python dan yang
          dipakai konsumen lain (Swagger, billing-backend AdonisJS). Backend ERP
          mengirim KEDUANYA sekaligus — lihat komentar di
          radiusclient/disconnect_api.go: "mengirim keduanya lebih murah daripada
          mendeteksi versi". Menerima hanya satu berarti pemanggil yang mengikuti
          dokumentasi Python diam-diam kehilangan field ini.
        type: string
      port:
        type: integer
      radius_secret:
        description: |-
          RadiusSecret — secret NAS yang diserahkan PEMANGGIL.

          Aplikasi Python menerimanya dan memakainya langsung (radclient
          <nas_ip>:<port> disconnect <secret>), sehingga NAS tidak perlu terdaftar
          di tabel `nas` instance ini. Backend ERP MENGIRIMNYA di jalur isolir utama
          (customer/service.go: RadiusSecret: n.Secret), jadi mengabaikannya berarti
          setiap NAS yang ada di ERP tapi belum terdaftar di tabel `nas` berhenti
          bisa diisolir — padahal sebelumnya jalan.
        type: string
      timeout_ms:
        type: integer
      username:
        type: string
    type: object
  schemas.V1DisconnectResponse:
    properties:
      acctsessionid:
        type: string
      code:
        type: string
      nas_ip:
        type: string
      nasipaddress:
        type: string
      output:
        type: string
      port:
        type: integer
      return_code:
        type: integer
      status:
        type: string
      success:
        description: |-
          ── Bentuk lama (aplikasi Python) — dikirim BERSAMAAN, bukan pengganti ──

          Pemanggil yang sudah ada membaca nama-nama ini. Yang paling menentukan
          adalah `output`: alat diagnosa cmd/periksa-jalur-kick memutuskan sebuah
          NAS "HIDUP (router menjawab)" HANYA dari strings.Contains(Output,
          "Received Disconnect"). Kalau kosong, SETIAP NAS dilaporkan tak menjawab —
          negatif palsu yang menyuruh operator mengejar kerusakan yang tak ada.
        type: boolean
      username:
        type: string
    type: object
  schemas.V1NAS:
    properties:
      community:
        type: string
      description:
        type: string
      id:
        type: integer
      nasname:
        type: string
      ports:
        type: integer
      secret:
        type: string
      server:
        type: string
      shortname:
        type: string
      type:
        type: string
    type: object
  schemas.V1NASCreate:
    properties:
      community:
        type: string
      description:
        type: string
      nasname:
        type: string
      ports:
        type: integer
      secret:
        type: string
      server:
        type: string
      shortname:
        type: string
      type:
        type: string
    type: object
  schemas.V1Radacct:
    properties:
      acctauthentic:
        type: string
      acctinputoctets:
        type: integer
      acctinterval:
        type: integer
      acctoutputoctets:
        type: integer
      acctsessionid:
        type: string
      acctsessiontime:
        type: integer
      acctstarttime:
        type: string
      acctstoptime:
        type: string
      acctterminatecause:
        type: string
      acctuniqueid:
        type: string
      acctupdatetime:
        type: string
      calledstationid:
        type: string
      callingstationid:
        type: string
      connectinfo_start:
        type: string
      connectinfo_stop:
        type: string
      framedipaddress:
        type: string
      framedprotocol:
        type: string
      nasipaddress:
        type: string
      nasportid:
        type: string
      nasporttype:
        type: string
      radacctid:
        type: integer
      realm:
        type: string
      servicetype:
        type: string
      username:
        type: string
    type: object
  schemas.V1Radcheck:
    properties:
      attribute:
        type: string
      id:
        type: integer
      op:
        type: string
      username:
        type: string
      value:
        type: string
    type: object
  schemas.V1Radgroupcheck:
    properties:
      attribute:
        type: string
      groupname:
        type: string
      id:
        type: integer
      op:
        type: string
      value:
        type: string
    type: object
  schemas.V1Radgroupreply:
    properties:
      attribute:
        type: string
      groupname:
        type: string
      id:
        type: integer
      op:
        type: string
      value:
        type: string
    type: object
  schemas.V1Radreply:
    properties:
      attribute:
        type: string
      id:
        type: integer
      op:
        type: string
      username:
        type: string
      value:
        type: string
    type: object
  schemas.V1Radusergroup:
    properties:
      groupname:
        type: string
      id:
        type: integer
      priority:
        type: integer
      username:
        type: string
    type: object
  schemas.V1RowIn:
    properties:
      attribute:
        type: string
      groupname:
        type: string
      op:
        type: string
      priority:
        type: integer
      username:
        type: string
      value:
        type: string
    type: object
  schemas.V1UserStatus:
    properties:
      is_online:
        description: |-
          IsOnline — nama yang DIBACA pemanggil (backend ERP men-decode ke
          `json:"is_online"`). Tanpa field ini, json.Unmarshal mengabaikan `online`
          dan IsOnline SELALU false — tanpa galat, tanpa jejak. Akibatnya cabang
          "pelanggan ONLINE tapi sesinya terdaftar dengan username lain" tak pernah
          tercapai, sehingga isolir yang tidak menggigit tercatat sebagai kabar
          jinak "pelanggan tidak online". Dikirim BERDUA (bukan diganti) supaya
          pemanggil lama yang membaca `online` tetap jalan.
        type: boolean
      online:
        type: boolean
      session:
        $ref: '#/definitions/schemas.V1Radacct'
      username:
        type: string
    type: object
  schemas.WebhookCreate:
    properties:
      event:
        example: session_stop
        type: string
      name:
        example: billing-listener
        type: string
      secret:
        example: shared-secret-for-hmac
        type: string
      url:
        example: https://billing.example.com/hooks/radius
        type: string
    type: object
  schemas.WebhookCreatedResponse:
    properties:
      event:
        type: string
      id:
        type: integer
      name:
        type: string
      secret:
        example: shown ONLY once — store it securely
        type: string
      url:
        type: string
    type: object
  schemas.WebhookUpdate:
    properties:
      enabled:
        type: boolean
      event:
        type: string
      secret:
        type: string
      url:
        type: string
    type: object
info:
  contact: {}
  description: |-
    REST API untuk FreeRADIUS dengan multi-key auth, scope, audit log, rate limit,
    dashboard stats, RFC 5176 disconnect, IP pool, dan webhook event dispatch.
  title: FreeRADIUS API
  version: 0.3.0
paths:
  /:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Root info
      tags:
      - meta
  /api/accounting/sessions:
    get:
      parameters:
      - description: Filter by username
        in: query
        name: username
        type: string
      - description: Filter by NAS IP
        in: query
        name: nasipaddress
        type: string
      - description: Limit (max 1000)
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Radacct'
            type: array
      security:
      - ApiKeyAuth: []
      - BasicAuth: []
      summary: List session history
      tags:
      - accounting
  /api/accounting/sessions/active:
    get:
      parameters:
      - description: Limit (max 1000)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Radacct'
            type: array
      security:
      - ApiKeyAuth: []
      - BasicAuth: []
      summary: List currently active sessions (no Acct-Stop yet)
      tags:
      - accounting
  /api/accounting/users/{username}/usage:
    get:
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.UserUsage'
      security:
      - ApiKeyAuth: []
      - BasicAuth: []
      summary: Aggregated traffic & session count for a user
      tags:
      - accounting
  /api/audit:
    get:
      description: |-
        Filter by api_key_name, method, status (exact / range via from/to=200..299),
        path substring, time window (RFC3339). Sets X-Total-Count.
      parameters:
      - description: Filter by key name
        in: query
        name: api_key_name
        type: string
      - description: GET|POST|PUT|DELETE
        in: query
        name: method
        type: string
      - description: HTTP status exact match
        in: query
        name: status
        type: integer
      - description: HTTP status >= (used with status_max)
        in: query
        name: status_min
        type: integer
      - description: HTTP status <=
        in: query
        name: status_max
        type: integer
      - description: Path substring (LIKE %path%)
        in: query
        name: path
        type: string
      - description: RFC3339
        in: query
        name: from
        type: string
      - description: RFC3339
        in: query
        name: to
        type: string
      - description: Limit (max 1000)
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            X-Total-Count:
              description: total matching rows
              type: integer
          schema:
            items:
              $ref: '#/definitions/models.ApiAuditLog'
            type: array
      security:
      - ApiKeyAuth: []
      - BasicAuth: []
      summary: List API audit log (admin)
      tags:
      - audit
  /api/audit/before:
    delete:
      parameters:
      - description: RFC3339, hapus baris dengan timestamp < before
        in: query
        name: before
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              format: int64
              type: integer
            type: object
      security:
      - ApiKeyAuth: []
      - BasicAuth: []
      summary: Purge audit log older than `before` (admin)
      tags:
      - audit
  /api/groups:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
      security:
      - ApiKeyAuth: []
      - BasicAuth: []
      summary: List groups
      tags:
      - groups
    post:
      consumes:
      - application/json
      parameters:
      - description: Group payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/schemas.GroupCreate'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/schemas.GroupOut'
      security:
      - ApiKeyAuth: []
      - BasicAuth: []
      summary: Create group (insert group attributes)
      tags:
      - groups
  /api/groups/{groupname}:
    delete:
      parameters:
      - description: Group name
        in: path
        name: groupname
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - ApiKeyAuth: []
      - BasicAuth: []
      summary: Delete group
      tags:
      - groups
    get:
      parameters:
      - description: Group name
        in: path
        name: groupname
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.GroupOut'
      security:
      - ApiKeyAuth: []
      - BasicAuth: []
      summary: Get group detail
      tags:
      - groups
  /api/groups/{groupname}/users/{username}:
    delete:
      parameters:
      - description: Group name
        in: path
        name: groupname
        required: true
        type: string
      - description: Username
        in: path
        name: username
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BasicAuth: []
      summary: Remove user from group
      tags:
      - groups
    post:
      parameters:
      - description: Group name
        in: path
        name: groupname
        required: true
        type: string
      - description: Username
        in: path
        name: username
        required: true
        type: string
      - description: Priority
        in: query
        name: priority
        type: integer
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      - BasicAuth: []
      summary: Add user to group
      tags:
      - groups
  /api/ippool/leases:
    get:
      parameters:
      - description: Filter by username
        in: query
        name: username
        type: string
      - description: Filter by pool_name
        in: query
        name: pool
        type: string
      - description: Limit (max 1000)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Radippool'
            type: array
      security:
      - ApiKeyAuth: []
      - BasicAuth: []
      summary: List active leases (filter by username/pool)
      tags:
      - ippool
  /api/ippool/leases/{id}:
    delete:
      description: |-
        Tidak menghapus row (FreeRADIUS sqlippool perlu row tetap ada),
        hanya menandai lease selesai supaya bisa di-realloc.
      parameters:
      - description: radippool.id
        in: path
