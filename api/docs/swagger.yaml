    post:
      consumes:
      - application/json
      description: |-
        Looks up session by acctuniqueid in radacct, finds NAS secret in the nas table
        (matched by nasipaddress = nas.nasname), then sends a Disconnect-Request
        to the NAS over UDP. Returns the NAS response (ACK / NAK / timeout).
      parameters:
      - description: radacct.acctuniqueid
        in: path
        name: acctuniqueid
        required: true
        type: string
      - description: Override port / timeout
        in: body
        name: body
        schema:
          $ref: '#/definitions/schemas.DisconnectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.DisconnectResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BasicAuth: []
      summary: Disconnect an active session (RFC 5176 Disconnect-Request)
      tags:
      - sessions
