services:
  db:
    image: mariadb:11.4
    container_name: radius-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass_ganti}
      MARIADB_DATABASE: ${DB_NAME:-radius}
      MARIADB_USER: ${DB_USER:-radius}
      MARIADB_PASSWORD: ${DB_PASSWORD:-radiuspass_ganti}
    volumes:
      - radius_db:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  freeradius:
    # Tag DIPAKU, tidak `latest`. raddb/ disalin dari image ini oleh setup.sh;
    # kalau tag-nya bergerak dan container dibuat ulang, server berjalan dengan
    # versi berbeda dari config yang disalin untuknya. Di appliance mitra yang
    # tak pernah disentuh berbulan-bulan, itu bom waktu tanpa gejala awal.
    # Satu sumber: FR_TAG di .env (setup.sh memakai nilai yang sama).
    image: freeradius/freeradius-server:${FR_TAG:-3.2.10}
    container_name: freeradius
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    volumes:
      - ./freeradius/raddb:/etc/raddb:ro
    # `radiusd -f` — foreground, BUKAN `-X`.
    #
    # `-X` adalah mode debug: log tiap paket dalam bentuk penuh. Di appliance
    # yang berjalan sendiri berbulan-bulan itu berarti disk mitra terisi log
    # sampai penuh, dan README menyuruh menggantinya "setelah stabil" — tak ada
    # yang akan melakukannya di mesin yang tak pernah dilihat siapa pun.
    #
    # Ditulis eksplisit, bukan dihapus supaya jatuh ke CMD bawaan image:
    # bawaan itu milik upstream dan bisa berubah di versi berikutnya.
    command: ["radiusd", "-f"]
    # Tidak ada healthcheck di sini DENGAN SENGAJA. Satu-satunya probe yang
    # jujur untuk FreeRADIUS adalah paket RADIUS sungguhan (Status-Server), dan
    # itu harus dinyalakan dulu di raddb. Probe palsu — mis. memeriksa proses
    # masih hidup — justru membuat container tampak sehat saat ia sudah menolak
    # setiap auth karena gagal konek DB.

  api:
    # api/Dockerfile dibangun TANPA jaringan selain menarik dua base image:
    # tak ada apk, tak ada go install, tak ada go mod tidy (vendor/ dan docs/
    # ter-commit). Terbukti dengan `docker build --network=none` 13 Okt 2026.
    build: ./api
    # Tidak pernah mencoba Docker Hub untuk nama yang hanya hidup di mesin ini.
    # Tanpa ini `up` mengawali dengan `Image freeradius-api-local:1 Pulling`
    # yang pasti gagal, lalu baru membangun — perjalanan sia-sia yang di
    # appliance tanpa egress registry berarti menggantung sebelum memulai.
    # Kalau image-nya belum ada, compose TETAP membangun (diuji 13 Okt 2026).
    pull_policy: never
    # image: DIBERI NAMA supaya firstboot.sh bisa memastikan image-nya memang
    # sudah ada di appliance SEBELUM `up`. Appliance mitra bisa berada di
    # jaringan dengan egress tersaring (terbukti 28 Sep 2026: `apk add` gagal
    # ke dl-cdn.alpinelinux.org meski Docker Hub jalan), jadi `up` yang
    # diam-diam mencoba membangun ulang akan menggantung tanpa penjelasan.
    # Nama hasil build compose bergantung nama direktori proyek — terlalu
    # rapuh untuk dijadikan patokan pemeriksaan.
    image: freeradius-api-local:1
    container_name: freeradius-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-radius}
      DB_PASSWORD: ${DB_PASSWORD:-radiuspass_ganti}
      DB_NAME: ${DB_NAME:-radius}
      API_KEY: ${API_KEY:-change-me-to-a-long-random-string}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      WEBHOOK_POLL_SECONDS: ${WEBHOOK_POLL_SECONDS:-5}
    ports:
      - "8000:8000"

volumes:
  radius_db:
    name: freeradius_mariadb_data
